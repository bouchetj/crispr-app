services:
  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: crispr_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_ENV: prod
    container_name: crispr_backend
    env_file:
      - ./.env.prod
    environment:
      - PYTHONPATH=/app:/app/backend
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/data
    networks:
      - default


  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        APP_ENV: prod
    container_name: crispr_frontend
    depends_on:
      - backend
    networks:
      - default

# Celery Worker
  celery-worker:
    build:
      context: ./backend/celery_app
      dockerfile: Dockerfile
    container_name: celery_worker
    cpus: 4
    cpu_shares: 512 
    env_file:
      - ./.env.prod
    environment:
      - PYTHONPATH=/app:/app/backend
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/data
    command: ["micromamba","run","-n","celery","celery","-A","backend.celery_app.celery_app.celery_app","worker","--loglevel=info"]
    networks:
      - default

  crispr-proxy:
    image: nginx:alpine
    container_name: crispr_proxy
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - default
      - edge

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
    external: true
