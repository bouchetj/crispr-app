dir /data
# RDB snapshots (optional but recommended)
save 900 1
save 300 10
save 60 10000

# AOF for durability
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# (Optionally) make it a bit safer by refusing writes if no disk
stop-writes-on-bgsave-error yes
